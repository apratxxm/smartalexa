# "Review dispositions" C1-C8). Capability and argument names: assistant/conversation_contracts.py::CAPABILITIES.
# Entry fields: text, expect (admit|refuse), capability?, args? (only where unambiguous), c1? (true = admit only on exact match), why.
# Refusals carry capability/args only when an argument mismatch is the point of the entry.
